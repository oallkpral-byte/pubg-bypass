name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pyinstaller
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --console --name "PUBG_Bypass" bypass.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PUBG_Bypass
        path: dist/PUBG_Bypass.exe
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/PUBG_Bypass.exe
        tag_name: v1.0
